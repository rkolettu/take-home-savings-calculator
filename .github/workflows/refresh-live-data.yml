name: Refresh live data

on:
  push:
    paths:
      - 'scripts/refresh-live-data.mjs'
      - 'scripts/refresh-live-data.test.mjs'
      - 'scripts/refresh-eia-electricity.py'
      - '.github/workflows/refresh-live-data.yml'
  schedule:
    # HUD FMR data changes annually and the EIA bill workbook is published
    # annually too. A weekly check is frequent enough while keeping external
    # traffic tiny and independent of website visitors.
    - cron: '15 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install openpyxl

      - name: Refresh HUD FMR housing drift
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: node scripts/refresh-live-data.mjs

      # Independent of HUD: this script exits zero and keeps the last known
      # good values when the EIA download or validation fails.
      - name: Refresh EIA residential electricity bills
        run: python3 scripts/refresh-eia-electricity.py

      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- src/data/liveData.json src/data/sourcedCosts.json src/data/costDataConfig.ts; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/liveData.json src/data/sourcedCosts.json src/data/costDataConfig.ts
          git commit -m "chore: refresh public cost data"
          git pull --rebase origin main
          git push
