name: Refresh live data

on:
  push:
    paths:
      - 'scripts/refresh-live-data.mjs'
      - 'scripts/refresh-live-data.test.mjs'
      - '.github/workflows/refresh-live-data.yml'
  schedule:
    # HUD FMR data changes annually. A weekly check is frequent enough while
    # keeping external traffic tiny and independent of website visitors.
    - cron: '15 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh HUD FMR housing drift
        env:
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: node scripts/refresh-live-data.mjs

      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- src/data/liveData.json src/data/sourcedCosts.json src/data/costDataConfig.ts; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/liveData.json src/data/sourcedCosts.json src/data/costDataConfig.ts
          git commit -m "chore: refresh public cost data"
          git push
