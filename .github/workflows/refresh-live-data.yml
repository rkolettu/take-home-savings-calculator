name: Refresh live data

on:
  push:
    paths:
      - 'scripts/refresh-live-data.mjs'
      - 'scripts/refresh-eia-electricity.py'
      - '.github/workflows/refresh-live-data.yml'
  schedule:
    # Source datasets are monthly/annual. A weekly check is frequent enough
    # while keeping external traffic tiny and independent of website visitors.
    - cron: '15 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install EIA workbook reader
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5

      - name: Refresh state electricity bills
        continue-on-error: true
        run: python scripts/refresh-eia-electricity.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh latest public data
        run: node scripts/refresh-live-data.mjs

      - name: Commit updated data when changed
        run: |
          if git diff --quiet -- src/data/liveData.json src/data/sourcedCosts.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/liveData.json src/data/sourcedCosts.json
          git commit -m "chore: refresh public cost data"
          git push
